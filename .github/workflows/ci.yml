name: CI

# Type-check guard. Turbopack dev does not type-check and `next build` only
# runs at Docker/deploy time, so type errors could sit unnoticed on a branch.
# This runs `tsc --noEmit` on every push and on PRs into master, giving early
# feedback well before the build.
on:
  push:
  pull_request:
    branches: [master]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      # prisma generate parses the schema (which references env("DATABASE_URL"));
      # it does not connect, so a dummy value is enough for CI.
      DATABASE_URL: "sqlserver://localhost:1433;database=ci;user=ci;password=ci;encrypt=true;trustServerCertificate=true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npm run typecheck
