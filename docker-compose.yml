# ── SalesFlow CRM — PRODUCTION ────────────────────────────────────────────────
# Secrets are NOT committed: replace the two <PLACEHOLDER> values at deploy time
# (Container Station GUI paste), or use the env_file variant below.
#   <DB_PASSWORD>      — the salesflow_app SQL password
#   <NEXTAUTH_SECRET>  — long random string (openssl rand -base64 32)
#
# NOTE (2026-06): the previous version of this file committed the real DB
# password + secret to the repo (git history). Rotate both before relying on
# the placeholders here.
#
# CLI alternative: comment out `environment:` and use an env_file instead:
#   env_file: [.env.prod]      (.env.prod is gitignored; see .env.example)
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salesflow-crm
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "sqlserver://172.28.10.2\\MFILES_SQL;database=SalesFlowCRM;user=salesflow_app;password=<DB_PASSWORD>;encrypt=true;trustServerCertificate=true"
      NEXTAUTH_SECRET: "<NEXTAUTH_SECRET>"
      NEXTAUTH_URL: "http://192.168.1.197:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
