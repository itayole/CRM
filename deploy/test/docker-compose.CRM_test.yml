# ── CRM_test — test deployment for the QNAP (192.168.1.197) ──────────────────
# A separate container "CRM_test" on port 3001, running ALONGSIDE prod
# (salesflow-crm, :3000). Points at the SalesFlowCRM_test database copy, so
# destructive testing never touches production data.
#
# Pulls the pre-built app image (same image as prod — only the env differs).
# Build & push the image from a build machine, then `pull` on the QNAP.
# See README.md in this directory for the full runbook.
services:
  crm-test:
    # ⚠ confirm/adjust to your actual image name + tag if different:
    image: ghcr.io/itayole/salesflow-crm:latest
    container_name: CRM_test
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env.test
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
